
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Chu's China Bistro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #61122f;
            color: white;
        }

        header {
            background: #f6b319;
            padding: 15px 7%;
            display: flex;
            align-items: center;
            gap: 20px;
            color: #557c3e;
        }

        header img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header p {
            margin: 5px 0;
            font-size: 13px;
            letter-spacing: 2px;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .hero img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border: 3px solid #fff;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .tile {
            position: relative;
            height: 200px;
            overflow: hidden;
            border: 2px solid white;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .tile:hover img {
            transform: scale(1.05);
        }

        .tile span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #222;
            color: #ddd;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 12px;
            }

            header img {
                width: 60px;
                height: 60px;
            }

            header h1 {
                font-size: 19px;
            }

            .tiles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="images/restaurant-logo.png" alt="Restaurant Logo">

        <div>
            <h1>David Chu's China Bistro</h1>
            <p>CHINESE RESTAURANT</p>
        </div>
    </header>

    <main>

        <section class="hero">
            <img src="images/jumbotron_1200.jpg" alt="Restaurant Interior">
        </section>

        <section class="tiles">

            <div class="tile">
                <img src="images/menu-tile.jpg" alt="Menu">
                <span>Menu</span>
            </div>

            <div class="tile">
                <img src="images/specials-tile.jpg" alt="Specials">
                <span>Specials</span>
            </div>

        </section>

    </main>

    <footer>
        <p>David Chu's China Bistro</p>
        <p>Fresh Chinese Food • Quality Ingredients</p>
    </footer>

</body>
</html>
